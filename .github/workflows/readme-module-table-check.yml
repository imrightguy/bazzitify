name: README Module Table Check

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'modules/**'
  pull_request:
    branches: [master]
    paths:
      - 'README.md'
      - 'modules/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-module-check:
    name: Check README Modules table vs modules/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate README Modules table
        run: ./scripts/validate-readme-modules.sh