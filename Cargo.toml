[package]
name = "bazzitify"
version = "0.1.0"
edition = "2024"
description = "Bazzite-style gaming optimization for mutable distros — Rust GUI"

[dependencies]
slint = { version = "1.17.1", features = ["gettext"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "2.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "bazzitify"
path = "src/main.rs"

[[bin]]
name = "bazzitify-profile"
path = "src/profile_cli.rs"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
